<svg width="800" height="420" viewBox="0 0 800 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-bg {
      fill: #0d1117;
      stroke: url(#cyan-purple-grad);
      stroke-width: 2.5;
    }
    .panel-bg {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 1;
    }
    .text-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 22px;
      fill: #ffffff;
      letter-spacing: 2px;
    }
    .text-subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #58a6ff;
      letter-spacing: 1px;
    }
    .text-label {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 12px;
      fill: #8b949e;
    }
    .text-value {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 13px;
      fill: #ffffff;
    }
    .section-header {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: bold;
      font-size: 14px;
      fill: #ff7b72;
      letter-spacing: 1.5px;
    }
    .bar-bg {
      fill: #21262d;
      rx: 3px;
    }
    .bar-fill-hp { fill: url(#hp-grad); rx: 3px; }
    .bar-fill-mp { fill: url(#mp-grad); rx: 3px; }
    .bar-fill-exp { fill: url(#exp-grad); rx: 3px; }
    .bar-fill-attr { fill: url(#attr-grad); rx: 3px; }
    
    .gear-box {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1;
      rx: 6px;
    }
    .gear-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: bold;
      font-size: 10px;
      fill: #8b949e;
    }
    .gear-name {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: bold;
      font-size: 11px;
      fill: #58a6ff;
    }
  </style>

  <defs>
    <!-- Gradients -->
    <linearGradient id="cyan-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#9b51e0" />
    </linearGradient>
    <linearGradient id="hp-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#60efff" />
    </linearGradient>
    <linearGradient id="mp-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="exp-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6" />
      <stop offset="100%" stop-color="#ff5858" />
    </linearGradient>
    <linearGradient id="attr-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2994a" />
      <stop offset="100%" stop-color="#f2c94c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Card Container -->
  <rect x="10" y="10" width="780" height="400" rx="12" class="card-bg" filter="url(#glow)"/>

  <!-- LEFT PANEL: Character Info & Avatar -->
  <g transform="translate(30, 30)">
    <!-- Avatar Frame -->
    <rect x="0" y="0" width="220" height="220" rx="8" class="panel-bg" />
    <!-- Cyber Avatar Graphic -->
    <circle cx="110" cy="95" r="45" fill="none" stroke="url(#cyan-purple-grad)" stroke-width="3" stroke-dasharray="10 5" />
    <path d="M75 175C75 145 90 140 110 140C130 140 145 145 145 175" fill="none" stroke="url(#cyan-purple-grad)" stroke-width="3" />
    <polygon points="110,65 118,80 102,80" fill="#00f2fe"/>
    <circle cx="102" cy="95" r="3" fill="#00f2fe" />
    <circle cx="118" cy="95" r="3" fill="#00f2fe" />
    <path d="M102 110Q110 115 118 110" fill="none" stroke="#00f2fe" stroke-width="2" />
    
    <!-- Level Badge -->
    <rect x="85" y="190" width="50" height="22" rx="4" fill="#00f2fe" />
    <text x="110" y="206" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" fill="#0d1117" text-anchor="middle">LVL 22</text>

    <!-- Info Text -->
    <text x="0" y="255" class="text-title">SAMIKSHA</text>
    <text x="0" y="278" class="text-title" fill="#00f2fe">SHARMA</text>
    <text x="0" y="302" class="text-subtitle">CO-OP ENGINEER // IOT MAGE</text>
    
    <!-- Title -->
    <rect x="0" y="318" width="220" height="28" rx="4" fill="#1f2937" stroke="#30363d" />
    <text x="110" y="336" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" fill="#ff7b72" text-anchor="middle">🏆 Rajput Innovation Champion</text>
  </g>

  <!-- RIGHT PANEL: Stats, Attributes & Gear -->
  <g transform="translate(280, 30)">
    <!-- Base Panel Grid -->
    <rect x="0" y="0" width="490" height="360" rx="8" class="panel-bg" />

    <!-- Column 1: Player Vitals & Attributes (Left side of right panel) -->
    <g transform="translate(25, 25)">
      <text x="0" y="0" class="section-header">❤️ PLAYER VITALS</text>
      
      <!-- HP / CGPA -->
      <g transform="translate(0, 15)">
        <text x="0" y="12" class="text-label">HP [CGPA]</text>
        <rect x="110" y="3" width="100" height="10" class="bar-bg" />
        <rect x="110" y="3" width="94" height="10" class="bar-fill-hp" />
        <text x="220" y="12" class="text-value">9.55 / 10</text>
      </g>

      <!-- MP / Matriculation -->
      <g transform="translate(0, 40)">
        <text x="0" y="12" class="text-label">MP [MATRIC]</text>
        <rect x="110" y="3" width="100" height="10" class="bar-bg" />
        <rect x="110" y="3" width="98" height="10" class="bar-fill-mp" />
        <text x="220" y="12" class="text-value">98.8%</text>
      </g>

      <!-- EXP / Higher Sec -->
      <g transform="translate(0, 65)">
        <text x="0" y="12" class="text-label">EXP [H-SEC]</text>
        <rect x="110" y="3" width="100" height="10" class="bar-bg" />
        <rect x="110" y="3" width="94" height="10" class="bar-fill-exp" />
        <text x="220" y="12" class="text-value">94.6%</text>
      </g>

      <!-- Section Separator -->
      <line x1="0" y1="95" x2="280" y2="95" stroke="#30363d" stroke-width="1" />

      <!-- Attributes -->
      <text x="0" y="115" class="section-header">⚔️ ATTRIBUTES</text>

      <!-- Code Crafting -->
      <g transform="translate(0, 130)">
        <text x="0" y="12" class="text-label">CODE CRAFTING</text>
        <rect x="110" y="3" width="100" height="10" class="bar-bg" />
        <rect x="110" y="3" width="90" height="10" class="bar-fill-attr" />
        <text x="220" y="12" class="text-value">90 / 100</text>
      </g>

      <!-- IoT Synthesis -->
      <g transform="translate(0, 155)">
        <text x="0" y="12" class="text-label">IOT SYNTHESIS</text>
        <rect x="110" y="3" width="100" height="10" class="bar-bg" />
        <rect x="110" y="3" width="85" height="10" class="bar-fill-attr" />
        <text x="220" y="12" class="text-value">85 / 100</text>
      </g>

      <!-- Hackathon Raids -->
      <g transform="translate(0, 180)">
        <text x="0" y="12" class="text-label">HACKATHON RAIDS</text>
        <rect x="110" y="3" width="100" height="10" class="bar-bg" />
        <rect x="110" y="3" width="95" height="10" class="bar-fill-attr" />
        <text x="220" y="12" class="text-value">95 / 100</text>
      </g>

      <!-- Speechcraft -->
      <g transform="translate(0, 205)">
        <text x="0" y="12" class="text-label">SPEECHCRAFT</text>
        <rect x="110" y="3" width="100" height="10" class="bar-bg" />
        <rect x="110" y="3" width="90" height="10" class="bar-fill-attr" />
        <text x="220" y="12" class="text-value">90 / 100</text>
      </g>
    </g>

    <!-- Vertical Divider -->
    <line x1="330" y1="25" x2="330" y2="335" stroke="#30363d" stroke-width="1" />

    <!-- Column 2: Equipped Inventory (Right side of right panel) -->
    <g transform="translate(350, 25)">
      <text x="0" y="0" class="section-header">🎒 EQUIPPED GEAR</text>
      
      <!-- Weapon Slot -->
      <g transform="translate(0, 20)">
        <rect x="0" y="0" width="115" height="60" class="gear-box" />
        <text x="10" y="20" class="gear-title">WEAPON (MAIN-HAND)</text>
        <text x="10" y="40" class="gear-name" fill="#ff7b72">🗡️ Flask &amp; Node</text>
      </g>

      <!-- Shield Slot -->
      <g transform="translate(0, 95)">
        <rect x="0" y="0" width="115" height="60" class="gear-box" />
        <text x="10" y="20" class="gear-title">SHIELD (OFF-HAND)</text>
        <text x="10" y="40" class="gear-name" fill="#58a6ff">🛡️ Git &amp; Linux</text>
      </g>

      <!-- Spell Book -->
      <g transform="translate(0, 170)">
        <rect x="0" y="0" width="115" height="60" class="gear-box" />
        <text x="10" y="20" class="gear-title">ACTIVE SPELLS</text>
        <text x="10" y="40" class="gear-name" fill="#d2a8ff">🧪 CrewAI &amp; IoT</text>
      </g>

      <!-- Accessory -->
      <g transform="translate(0, 245)">
        <rect x="0" y="0" width="115" height="60" class="gear-box" />
        <text x="10" y="20" class="gear-title">ACCESSORY</text>
        <text x="10" y="40" class="gear-name" fill="#f2c94c">💍 Figma &amp; Grafana</text>
      </g>
    </g>
  </g>
</svg>
