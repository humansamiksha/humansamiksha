<svg width="850" height="460" viewBox="0 0 850 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-front {
      fill: #0c0e14;
      stroke: url(#sunset-shift-grad);
      stroke-width: 2.5;
    }
    .panel-bg {
      fill: #151922;
      stroke: #30363d;
      stroke-width: 1;
    }
    .text-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 20px;
      fill: #ffffff;
      letter-spacing: 2px;
    }
    .text-subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #ff7e5f;
      letter-spacing: 1px;
    }
    .text-label {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 10px;
      fill: #8b949e;
    }
    .text-value {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 10px;
      fill: #ffffff;
    }
    .section-header {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: bold;
      font-size: 11px;
      fill: #feb47b;
      letter-spacing: 1.5px;
    }
    .bar-bg {
      fill: #21262d;
      rx: 2.5px;
    }
    .bar-fill-hp { fill: url(#hp-grad); rx: 2.5px; }
    .bar-fill-cq { fill: url(#cq-grad); rx: 2.5px; }
    .bar-fill-exp { fill: url(#exp-grad); rx: 2.5px; }
    .bar-fill-attr { fill: url(#sunset-shift-grad); rx: 2.5px; }
    
    .gear-box {
      fill: #0c0e14;
      stroke: #30363d;
      stroke-width: 0.75;
      rx: 4px;
    }
    .gear-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: bold;
      font-size: 8px;
      fill: #8b949e;
    }
    .gear-name {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: bold;
      font-size: 9.5px;
    }
  </style>

  <defs>
    <!-- SUNSET GRADIENTS -->
    <linearGradient id="sunset-shift-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e5f">
        <animate attributeName="stop-color" values="#ff7e5f;#feb47b;#ff2e63;#ff7e5f" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#feb47b">
        <animate attributeName="stop-color" values="#feb47b;#ff2e63;#ff7e5f;#feb47b" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff2e63">
        <animate attributeName="stop-color" values="#ff2e63;#ff7e5f;#feb47b;#ff2e63" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Radial Sunset Sun Gradient -->
    <radialGradient id="sun-radial" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#ffea00" />
      <stop offset="65%" stop-color="#ff5e62" />
      <stop offset="100%" stop-color="#ff2e63" />
    </radialGradient>

    <linearGradient id="hp-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7675" />
      <stop offset="100%" stop-color="#ff9f43" />
    </linearGradient>
    <linearGradient id="cq-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca503" />
      <stop offset="100%" stop-color="#ff2e63" />
    </linearGradient>
    <linearGradient id="exp-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f43" />
      <stop offset="100%" stop-color="#9b51e0" />
    </linearGradient>

    <!-- Heavy Sun Glow Filter -->
    <filter id="sun-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.9" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card Shadow -->
    <filter id="shadow-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#ff7e5f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ================= BACKGROUND LAYER ================= -->
  <!-- Deep Space Dark Sky Background -->
  <rect width="850" height="460" rx="16" fill="#080a0f"/>

  <!-- Giant Glowing Sunset Sun (Absolute Background) -->
  <circle cx="425" cy="180" r="110" fill="url(#sun-radial)" filter="url(#sun-glow)">
    <!-- Sun slowly pulses in size representing heat/energy -->
    <animate attributeName="r" values="110;116;110" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Background Mountain Silhouettes (Sun sets/rises behind these) -->
  <path d="M-50 460 L280 260 L610 460 Z" fill="#111520" opacity="0.65" />
  <path d="M280 460 L580 220 L880 460 Z" fill="#171d2b" opacity="0.8" />

  <!-- ================= FOREGROUND LAYER (3D HOVERING CARD) ================= -->
  <!-- The card floats up & down creating a beautiful 3D parallax effect against the background Sun -->
  <g>
    <animateTransform 
       attributeName="transform" 
       type="translate" 
       values="0,10; 0,-10; 0,10" 
       dur="5s" 
       repeatCount="indefinite"/>

    <!-- 3D Isometric Tilt -->
    <g transform="translate(85, 95) rotate(-3) skewX(5) scale(0.96, 0.93)" filter="url(#shadow-filter)">
      
      <!-- 3D Thickness (Depth Layers) -->
      <rect x="13" y="13" width="710" height="280" rx="10" fill="#040609" stroke="#161b22" stroke-width="2"/>
      <rect x="11" y="11" width="710" height="280" rx="10" fill="#0d1117" stroke="#21262d" stroke-width="2"/>
      
      <!-- Card Front Face -->
      <rect x="10" y="10" width="710" height="280" rx="10" class="card-front"/>

      <!-- Left Column: Bio Details -->
      <g transform="translate(25, 25)">
        <text x="0" y="45" class="text-title">SAMIKSHA</text>
        <text x="0" y="66" class="text-title" fill="url(#sunset-shift-grad)">SHARMA</text>
        <text x="0" y="88" class="text-subtitle">COMPUTER ENGINEERING // EXPLORER</text>
        
        <!-- Status Indicator Box -->
        <rect x="0" y="105" width="200" height="42" rx="5" fill="#151922" stroke="#30363d" />
        <text x="12" y="121" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="10" fill="#feb47b">✨ Current Status:</text>
        <text x="12" y="136" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="9" fill="#ffffff">Gets excited about anything cool!</text>

        <!-- Compass Icon (Minimal decoration) -->
        <g transform="translate(0, 165)">
          <circle cx="20" cy="20" r="18" fill="none" stroke="#30363d" stroke-width="1.5" />
          <polygon points="20,8 24,20 16,20" fill="#ff7675" />
          <polygon points="20,32 24,20 16,20" fill="#9b51e0" />
          <text x="45" y="24" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8b949e">Curiosity Level: Maxed Out</text>
        </g>
      </g>

      <!-- Right Column: Stats & Gear Panel -->
      <g transform="translate(250, 25)">
        <rect x="0" y="0" width="435" height="250" rx="6" class="panel-bg" />

        <!-- Sub-column 1: Vitals & Attributes -->
        <g transform="translate(15, 15)">
          <text x="0" y="0" class="section-header">🌅 MY STATUS</text>
          
          <!-- HP / CGPA -->
          <g transform="translate(0, 10)">
            <text x="0" y="9" class="text-label">HP [CGPA]</text>
            <rect x="85" y="2" width="90" height="6" class="bar-bg" />
            <rect x="85" y="2" width="84.6" height="6" class="bar-fill-hp" />
            <text x="180" y="9" class="text-value">9.41/10</text>
          </g>

          <!-- Curiosity / CQ -->
          <g transform="translate(0, 26)">
            <text x="0" y="9" class="text-label">CQ [EXPLORE]</text>
            <rect x="85" y="2" width="90" height="6" class="bar-bg" />
            <rect x="85" y="2" width="90" height="6" class="bar-fill-cq" />
            <text x="180" y="9" class="text-value">100/100</text>
          </g>

          <!-- Focus Span / EXP -->
          <g transform="translate(0, 42)">
            <text x="0" y="9" class="text-label">FOCUS SPAN</text>
            <rect x="85" y="2" width="90" height="6" class="bar-bg" />
            <rect x="85" y="2" width="45" height="6" class="bar-fill-exp" />
            <text x="180" y="9" class="text-value">Dynamic 📈</text>
          </g>

          <line x1="0" y1="62" x2="235" y2="62" stroke="#30363d" stroke-width="0.75" />

          <!-- Attributes -->
          <text x="0" y="78" class="section-header">🧭 STUFF I EXPLORE</text>

          <!-- Web Crafting -->
          <g transform="translate(0, 90)">
            <text x="0" y="9" class="text-label">WEB SYSTEMS</text>
            <rect x="85" y="2" width="90" height="6" class="bar-bg" />
            <rect x="85" y="2" width="81" height="6" class="bar-fill-attr" />
            <text x="180" y="9" class="text-value">90/100</text>
          </g>

          <!-- IoT Synthesis -->
          <g transform="translate(0, 106)">
            <text x="0" y="9" class="text-label">IOT SYSTEMS</text>
            <rect x="85" y="2" width="90" height="6" class="bar-bg" />
            <rect x="85" y="2" width="76.5" height="6" class="bar-fill-attr" />
            <text x="180" y="9" class="text-value">85/100</text>
          </g>

          <!-- Hackathons -->
          <g transform="translate(0, 122)">
            <text x="0" y="9" class="text-label">HACKATHONS</text>
            <rect x="85" y="2" width="90" height="6" class="bar-bg" />
            <rect x="85" y="2" width="88.2" height="6" class="bar-fill-attr" />
            <text x="180" y="9" class="text-value">98/100</text>
          </g>

          <!-- Speech & Writing -->
          <g transform="translate(0, 138)">
            <text x="0" y="9" class="text-label">SPEECH/WRITE</text>
            <rect x="85" y="2" width="90" height="6" class="bar-bg" />
            <rect x="85" y="2" width="81" height="6" class="bar-fill-attr" />
            <text x="180" y="9" class="text-value">90/100</text>
          </g>
        </g>

        <!-- Vertical Divider -->
        <line x1="270" y1="15" x2="270" y2="235" stroke="#30363d" stroke-width="0.75" />

        <!-- Sub-column 2: Explorer Inventory -->
        <g transform="translate(285, 15)">
          <text x="0" y="0" class="section-header">🎒 MY BAG</text>
          
          <!-- Web Slot -->
          <g transform="translate(0, 12)">
            <rect x="0" y="0" width="120" height="44" class="gear-box" />
            <text x="8" y="14" class="gear-title">WEB WORK</text>
            <text x="8" y="31" class="gear-name" fill="#ff7675">Flask &amp; Node</text>
          </g>

          <!-- IoT Slot -->
          <g transform="translate(0, 64)">
            <rect x="0" y="0" width="120" height="44" class="gear-box" />
            <text x="8" y="14" class="gear-title">IOT COMPASS</text>
            <text x="8" y="31" class="gear-name" fill="#feb47b">Bolt IoT &amp; C</text>
          </g>

          <!-- AI Runes -->
          <g transform="translate(0, 116)">
            <rect x="0" y="0" width="120" height="44" class="gear-box" />
            <text x="8" y="14" class="gear-title">AI AGENTS</text>
            <text x="8" y="31" class="gear-name" fill="#ff7675">CrewAI Agents</text>
          </g>

          <!-- Design & Creative -->
          <g transform="translate(0, 168)">
            <rect x="0" y="0" width="120" height="44" class="gear-box" />
            <text x="8" y="14" class="gear-title">CREATIVE WORK</text>
            <text x="8" y="31" class="gear-name" fill="#feb47b">Figma &amp; Writing</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
