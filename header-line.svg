<svg width="100%" height="4" viewBox="0 0 800 4" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="4" rx="2" fill="url(#header-shift-grad)"/>
  <defs>
    <linearGradient id="header-shift-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#00f2fe;#8b5cf6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#00f2fe;#8b5cf6;#ec4899" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#8b5cf6;#ec4899;#00f2fe" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
</svg>
